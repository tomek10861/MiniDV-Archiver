# ui-proxy: serves the static frontend/ (mounted) and proxies /api to the api
# container over the compose network.
server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # optional basic-auth (protects UI + /api, since it applies to the whole server
  # block): off by default — docker/auth.d is empty, so this include matches
  # nothing. See docker/.htpasswd.example to turn it on for an internet-facing
  # deployment (e.g. behind a Cloudflare Tunnel).
  include /etc/nginx/auth.d/*.conf;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # re-resolve the api service through Docker DNS so recreating that container
    # (compose up --build) doesn't leave nginx pointing at a dead address
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api;
    proxy_pass http://$api_upstream:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # master downloads and share re-encodes can be large / slow
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 0;
  }
}
