# MiniDV Archiver — UI service (split deployment).
# Serves the static frontend and proxies /api to the api process on 127.0.0.1:8080.
# Install: cp deploy/nginx-minidv.conf /etc/nginx/sites-available/minidv
#          ln -s ../sites-available/minidv /etc/nginx/sites-enabled/minidv && nginx -s reload

server {
    listen 80;
    server_name _;

    root /opt/minidv-archive/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # master downloads and share re-encodes can be large / slow
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 0;
    }
}
