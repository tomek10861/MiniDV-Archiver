[project]
name = "minidv-archiver"
version = "0.2.0"
description = "Lossless MiniDV / DV capture over FireWire with scene splitting, verified archival and a review dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tomek10861" }]
keywords = ["minidv", "dv", "firewire", "ieee1394", "dvgrab", "archival", "digitization", "video"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Archiving",
]
dependencies = []   # stdlib only; needs the external tools listed in the README

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/tomek10861/minidv-archiver"

[project.scripts]
minidv-archive = "minidv_archiver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["minidv_archiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
